name: Platform Matrix

# Additive cross-platform lane: the locked dependency set must stay green on
# Linux, macOS, and Windows across the supported Python band. Kept in a
# separate workflow so it never gates (or is gated by) ci.yml jobs.
#
# Python band: pyproject.toml has requires-python = ">=3.12", so the floor is
# 3.12 (3.11 cannot even `uv sync --frozen` — the resolver rejects it). The
# ceiling is 3.14, the newest stable CPython; wheel coverage for locked deps on
# cp314 is verified here rather than assumed.
#
# Sharding: each (os, python) combo is split into NUM_SHARDS jobs. A shard
# job re-runs `pytest --collect-only -q` (which prints "<path>: <count>" per
# file) and greedy-assigns files by test count. The assignment is deterministic
# because the inventory is LC_ALL=C sorted. These file shards avoid launching
# nested xdist workers within every platform job.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # This workflow stays on push — it is the Tier-A cross-platform
    # compatibility proof, so a code push must exercise it. Doc-only churn
    # must not: 36 jobs (3 OS x 3 Python x 4 shards) is the single largest
    # queue contributor, and a Markdown edit cannot change wheel availability.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel in-flight runs — this is the Tier-A cross-platform proof
  # (36 jobs). With 36 jobs per push, cancel-in-progress cancelled the previous
  # push before it could finish and neither push ever produced a verdict. The
  # group key still serialises; runs drain instead of superseding each other.
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Windows runners default to cp1252 locale encoding; every text artifact
  # this repo reads/writes is UTF-8, and POSIX runners already default to it.
  # PYTHONUTF8 pins PEP 540 UTF-8 mode on every interpreter in the matrix
  # (becomes the default in CPython 3.15 per PEP 686). PYTHONIOENCODING keeps
  # console I/O UTF-8 under Windows code pages.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  NUM_SHARDS: "4"
  # Makefile TEST_ENV block, mirrored (keep both sides identical) — OpenMP
  # thread pinning plus fork/fault hardening for the suite runs below
  # (.dsh-24x7/lane_reports/l3-segfault.md 7.1). VECLIB_MAXIMUM_THREADS matters
  # on the macOS leg (Accelerate), KMP_INIT_AT_FORK=FALSE closes the fork()
  # route taken by joblib/loky in the model tests.
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"
  KMP_INIT_AT_FORK: "FALSE"
  PYTHONFAULTHANDLER: "1"
  TOKENIZERS_PARALLELISM: "false"
  HYPOTHESIS_PROFILE: ci

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / shard${{ matrix.shard }}
    runs-on: ${{ matrix.os }}
    # macOS/Windows shards regularly brush the old 45-min ceiling after
    # uv sync --all-extras + collect + full not-network suite. Ubuntu
    # shards of ~1400 files were still advancing (pytest progress, not a
    # hang) when the 60-minute job timeout cancelled them. Raise so a
    # shard can finish; do not drop tests or shrink the OS/Python band.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
        shard: ["0", "1", "2", "3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historical receipt tests resolve archived source commits
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install macOS OpenMP runtime for locked LightGBM wheel
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          test -f "$(brew --prefix libomp)/lib/libomp.dylib"
      - name: Verify Windows GCC for native C parity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $command = Get-Command gcc -ErrorAction SilentlyContinue
          $compiler = if ($command) { $command.Source } else { 'C:\msys64\mingw64\bin\gcc.exe' }
          if (-not (Test-Path $compiler)) {
            throw 'GCC is unavailable; native C parity cannot run on Windows'
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Split-Path -Parent $compiler)
          & $compiler --version
      - name: Sync locked environment
        run: uv sync --frozen --all-groups --all-extras
      - name: Select balanced test-file shard
        shell: bash
        run: |
          set -euo pipefail
          collect_out="$RUNNER_TEMP/matrix-collect.txt"
          collect_err="$RUNNER_TEMP/matrix-collect.err"
          set +e
          uv run pytest --collect-only -q -m "not network" >"$collect_out" 2>"$collect_err"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::pytest --collect-only exited $rc"
            echo "----- collect stderr (tail) -----"
            tail -60 "$collect_err" || true
            echo "----- collect stdout (tail) -----"
            tail -30 "$collect_out" || true
            exit "$rc"
          fi
          inventory="$RUNNER_TEMP/matrix-inventory.txt"
          grep -E '^tests/.*: [0-9]+$' "$collect_out" \
            | LC_ALL=C sort -t: -k2 -nr > "$inventory"
          files=$(wc -l < "$inventory" | tr -d ' ')
          tests=$(awk -F': ' '{s += $NF} END {print s}' "$inventory")
          echo "inventory: $files files, $tests tests"
          if [ "$files" -lt 650 ] || [ "$tests" -lt 5500 ]; then
            echo "::error::pytest collect inventory unexpectedly small ($files files, $tests tests); output format or test selection may have changed"
            exit 1
          fi
          # Greedy list-scheduling over count-descending inventory: each file
          # goes to the currently lightest shard. Assignment is a pure
          # function of the sorted inventory, so all 4 shard jobs of a combo
          # agree on the partition.
          shard_file="$RUNNER_TEMP/matrix-shard.txt"
          awk -F': ' -v k="$NUM_SHARDS" -v want="${{ matrix.shard }}" '
            {
              min = 0
              for (i = 1; i < k; i++) if (sum[i] < sum[min]) min = i
              sum[min] += $NF
              if (min == want) print $1
            }
          ' "$inventory" > "$shard_file"
          n=$(wc -l < "$shard_file" | tr -d ' ')
          if [ "$n" -eq 0 ]; then
            echo "::error::shard ${{ matrix.shard }} selected no test files"
            exit 1
          fi
          echo "shard ${{ matrix.shard }}: $n test files"
      - name: Pytest shard
        shell: bash
        run: |
          set -euo pipefail
          shard_file="$RUNNER_TEMP/matrix-shard.txt"
          # Path order, not greedy order. pytest 9.1.1 (latest on PyPI;
          # fixture-identity fix is still unreleased) drops a nested
          # conftest's fixtures when a later file argument revisits that
          # directory after a file from its parent
          # (pytest-dev/pytest#14635). Sorting keeps each directory
          # contiguous, so the directory node that registered the fixtures
          # is the one later files in that directory bind to. Shard
          # membership is unchanged. Repo paths contain no spaces.
          # xargs -n caps each pytest argv — shards now select ~1300
          # files, far past the Windows 32k command-line limit; batches
          # keep sorted order and xargs exits nonzero if any batch fails.
          LC_ALL=C sort "$shard_file" | xargs -n 150 uv run pytest -q -m "not network"
