# PROOFCORE CI gates (DESIGN.md §9.3, §10) — additive workflow.
# Nothing here weakens ci.yml or fx1.yml: the global 80% coverage floor, the
# existing smoke/verify-research gates, and the fx1 honesty gate are untouched.
# Merge order (DESIGN.md §10): this workflow lands LAST — the proof/leakage/
# reality CLI invocations below exist once W1-W4 merge.
name: proofcore

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Do NOT cancel in-flight runs — this is a Tier-A gate. Cancelling it at this
  # repo's push cadence meant it never reached a verdict, which is
  # indistinguishable from passing. The group key still serialises runs.
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Hypothesis CI profile (DESIGN.md §9.5): derandomized, fixed example count.
  HYPOTHESIS_PROFILE: ci

jobs:
  # W5's own unit/integration tests + the layering whitelist gate.
  proofcore-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups
      - name: PROOFCORE tests
        run: make proofcore-test

  # §1.3 import-whitelist gate (A2 F1, local layering contract).
  layering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups
      - name: Layering gate
        run: uv run pytest tests/unit/test_proofcore_layering.py -q

  # Bundle verification checks hashes, sidecars, signatures, and recomputed
  # metrics. Historical replay remains closed until decision-time PIT reads.
  proof-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups --all-extras
      - name: Proof signer and recorder integrity
        run: make proof-integrity
      - name: Proof bundle verification
        run: make proof-verify

  # §9.3 leakage-scan — WARN MODE this wave (adjudicated): the scan runs, the
  # report is archived, findings do NOT fail the build. LH009 flips to error
  # only in the follow-up call-site migration wave (DESIGN.md §11.2, §14.3).
  # The seeded-leak fixture suite (W3) is blocking once present.
  leakage-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups
      - name: Leakage scan (warn mode)
        run: make leakage-scan
      - name: Upload leakage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leakage-report
          path: leakage-report.json
          if-no-files-found: ignore

  # §9.3 reality-filter. data/metadata/proofcore.duckdb is not in the repo
  # (data/metadata/** is gitignored). When that file is absent and
  # research/reality/trials.jsonl is a non-empty export, `make reality-gate`
  # scores that committed ledger with the unchanged filter. A missing db and
  # a missing committed ledger still prints REALITY_FILTER_SKIP; make maps
  # that to exit 0 and this step turns the skip line into a notice. A scored
  # verdict other than pass fails the job. continue-on-error is not used.
  # pipefail so tee does not hide a non-zero gate status.
  reality-filter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups
      - name: Reality-filter gate
        run: |
          set -o pipefail
          make reality-gate | tee "${RUNNER_TEMP:-/tmp}/reality-gate.log"
          if grep -q '^REALITY_FILTER_SKIP:' "${RUNNER_TEMP:-/tmp}/reality-gate.log"; then
            echo "::notice title=reality-filter::$(grep -m1 '^REALITY_FILTER_SKIP:' "${RUNNER_TEMP:-/tmp}/reality-gate.log")"
          fi

  # §12 A3 #4 committed-receipt audit: every receipts/*.json re-verifies
  # under its schema-appropriate verifier (sealed/v2 -> verify-receipt,
  # older research-catalog -> verify-research). Green only once
  # legacy-unsealed/ holds the unverifiable pre-seal artifacts.
  receipts-reverify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups
      - name: Re-verify committed receipts
        run: make receipts-reverify

  # §9.3/§12 coverage floors (A3 #2): per-package gates ADDITIVE to the
  # existing global 80% floor in ci.yml (which is not touched): pit 90,
  # proof 90, leakage 85, reality 90, proofcore 90 — read from
  # [tool.proofcore.coverage-floors] in pyproject.toml.
  coverage-floors:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups --all-extras
      - name: Per-package coverage floors
        run: make proofcore-coverage

  # A3 #2 second half: the fx1 lane gets its first coverage gate. Added here
  # (not in fx1.yml, which this wave does not edit) as a ratchet floor.
  fx1-coverage:
    runs-on: ubuntu-latest
    # Audit probes are multi-thousand-line functions. Serial coverage tracing
    # of tests/unit/fx1_serve hit this job's old 30 minute limit at 66%.
    # The 80% floor is unchanged; the longer limit lets that measurement finish.
    timeout-minutes: 90
    # Same thread pin as fx1.yml / ci.yml. -n auto in the make target forks.
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      KMP_INIT_AT_FORK: "FALSE"
      PYTHONFAULTHANDLER: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        # tiny_lm and the weight loader import torch / safetensors. Those
        # live in the nn extra; without it the coverage lane fails closed
        # before it can measure the package.
        run: uv sync --frozen --all-groups --extra nn
      - name: fx1 coverage ratchet
        # The 80% floor covers the whole fx1 package. tests/unit/fx1_serve
        # holds the audit probes; tests/fx1 alone leaves those modules at 0%.
        # make fx1-coverage splits those files across workers. Floor unchanged.
        run: make fx1-coverage
