name: Release

# Tag push (v1.2.3, v1.2.3-rc1, …) runs a preflight that requires:
#   1. tag ↔ fx1.__version__ ↔ CHANGELOG heading
#   2. same-SHA green ci / fx1 / proofcore / full platform matrix
#   3. latest completed CI run includes a green evidence-audit job
# then builds the sdist and wheel, writes a CycloneDX SBOM, signs the
# distributions with Sigstore, emits SLSA build provenance, and builds the
# runtime container (no registry push). This workflow does not publish to
# PyPI and does not create a GitHub Release. Artifacts are uploaded as
# workflow artifacts only. Verify downloaded bundles with:
#   uv run python scripts/verify_release_artifacts.py <dist-dir>
# Optional Sigstore identity check (needs network or --offline + bundles):
#   uv run python scripts/verify_release_artifacts.py <dist-dir> --sigstore \
#     --cert-identity \
#     "https://github.com/<owner>/<repo>/.github/workflows/release.yml@refs/tags/vX.Y.Z"
# SLSA provenance from GitHub artifact attestations:
#   gh attestation verify <artifact> --repo <owner>/<repo>
#
# workflow_dispatch dry_run=true builds wheel + SBOM + container and verifies
# checksums without signing, attesting, uploading, or requiring remote CI
# evidence. Prefer `make release-dry-run` locally before the owner tags.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build wheel/SBOM/container without signing or uploading"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Tag version and same-commit evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Local version and changelog consistency
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: python3 scripts/verify_release_readiness.py --local-only
      - name: Tag version, changelog, and same-commit workflow evidence
        if: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/verify_release_readiness.py
      - name: Fail closed unless CI and evidence-audit succeeded on this commit
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/require_release_gates.py \
            --repo "${GITHUB_REPOSITORY}" \
            --sha "${GITHUB_SHA}"

  build:
    needs: preflight
    name: Build, SBOM, sign, attest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build sdist and wheel
        run: uv build --out-dir dist

      - name: Smoke-test the wheel
        run: |
          set -euo pipefail
          uv sync --frozen --all-groups --no-install-project --no-build
          uv pip install --python .venv/bin/python --no-deps dist/*.whl
          .venv/bin/python scripts/smoke_installed_wheel.py

      - name: CycloneDX SBOM from the locked runtime set
        run: |
          set -euo pipefail
          # Default install plus optional extras (including nn). Dev group
          # excluded. uv writes CycloneDX 1.5 from uv.lock; no extra tool.
          uv export --format cyclonedx1.5 --frozen --no-dev --all-extras \
            --no-emit-project --output-file dist/sbom.cdx.json >/dev/null
          python - << 'PY'
          import json
          from pathlib import Path

          doc = json.loads(Path("dist/sbom.cdx.json").read_text())
          if doc.get("bomFormat") != "CycloneDX" or doc.get("specVersion") != "1.5":
              raise SystemExit(f"unexpected SBOM header: {doc.get('bomFormat')} {doc.get('specVersion')}")
          components = doc.get("components") or []
          if not components:
              raise SystemExit("SBOM has no components")
          print(f"CycloneDX {doc['specVersion']} components={len(components)}")
          PY

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.whl *.tar.gz sbom.cdx.json > SHA256SUMS
          cat SHA256SUMS

      - name: Sign distributions with Sigstore
        if: ${{ env.DRY_RUN != 'true' }}
        # setup-uv exports VIRTUAL_ENV. uvx with those variables unset uses
        # its own environment. sigstore 4.5 has no --oidc switch; on Actions
        # it takes the ambient OIDC token (id-token: write). The certificate
        # identity is the workflow file at GITHUB_REF (refs/tags/v…). Bundles
        # land next to each file as <name>.sigstore.json.
        run: |
          set -euo pipefail
          unset VIRTUAL_ENV UV_PYTHON UV_PROJECT_ENVIRONMENT
          shopt -s nullglob
          dists=(dist/*.whl dist/*.tar.gz)
          if [ "${#dists[@]}" -eq 0 ]; then
            echo "no distributions to sign" >&2
            exit 1
          fi
          uvx --from sigstore==4.5.0 sigstore sign "${dists[@]}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          echo "verifying certificate identity ${identity}"
          uvx --from sigstore==4.5.0 sigstore verify identity \
            --cert-identity "${identity}" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${dists[@]}"

      - name: SLSA build provenance
        if: ${{ env.DRY_RUN != 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cdx.json
            dist/SHA256SUMS

      - name: Attest the SBOM
        if: ${{ env.DRY_RUN != 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/sbom.cdx.json

      - name: Local checksum verification
        run: uv run --no-project python scripts/verify_release_artifacts.py dist

      - name: Build runtime container
        run: docker build --pull --tag dipcatcher-release:${{ github.sha }} .

      - name: Start container and wait for /health
        run: |
          set -euo pipefail
          docker run --detach --name dipcatcher-release dipcatcher-release:${{ github.sha }}
          for _ in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' dipcatcher-release)"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs dipcatcher-release
              exit 1
            fi
            sleep 2
          done
          docker logs dipcatcher-release
          exit 1

      - name: Remove runtime container
        if: always()
        run: docker rm --force dipcatcher-release || true

      - name: Upload release artifacts
        if: ${{ env.DRY_RUN != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists
          path: dist/*
          if-no-files-found: error
          retention-days: 14
