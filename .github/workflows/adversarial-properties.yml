name: Adversarial properties

on:
  # Phase 0: this push lane is restricted. The same suite already runs daily on
  # the nightly profile via property-nightly.yml, so re-running the bounded CI
  # profile on every one of this repo's very frequent pushes only deepens the
  # run queue — it adds no coverage the nightly lane lacks. PRs still gate here;
  # manual and ad-hoc runs are available below and via the nightly schedule.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  adversarial-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups --all-extras
      - name: Hypothesis adversarial suite (bounded CI profile)
        env:
          HYPOTHESIS_PROFILE: ci
          MLFLOW_DISABLE_AGENT_HINT: "1"
        run: |
          set -o pipefail
          start=$(uv run python -c 'import time; print(time.time())')
          uv run pytest -q --durations=20 -p no:cacheprovider \
            tests/property/test_adversarial_costs.py \
            tests/property/test_adversarial_returns_and_sizing.py \
            tests/property/test_adversarial_backtest.py \
            tests/property/test_adversarial_lookahead.py \
            tests/property/test_adversarial_resample_and_sources.py \
            tests/property/test_adversarial_receipts.py
          uv run python -c "import time; print('ELAPSED_SEC {:.3f}'.format(time.time() - float('${start}')))"
