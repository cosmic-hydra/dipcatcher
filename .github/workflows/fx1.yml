name: fx1

on:
  push:
    branches: [main, 'fx-1/**']
  pull_request:

# Least privilege. This workflow only reads the repo and runs tests.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  # Cancel superseded PR pushes only. Main/merge_group must finish (see the
  # 400-run zero-success history when every push cancelled the previous gate).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Makefile TEST_ENV block, mirrored (keep both sides identical) — OpenMP
    # thread pinning + fork/fault hardening (.dsh-24x7/lane_reports/l3-segfault.md
    # 7.1). tests/fx1 loads torch (src/fx1/train/tiny_lm.py) via the shared
    # tests/ conftest, so this lane gets the same pinning as the lab suite.
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      KMP_INIT_AT_FORK: "FALSE"
      PYTHONFAULTHANDLER: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen --all-groups --extra nn
      # Gates are invoked through their Make targets so the CI gate and
      # `make fx1-test` / `make fx1-lint` cannot drift (same commands, same
      # flags, same testpaths).
      - name: Lint
        run: make fx1-lint
      - name: Types
        run: |
          uv run mypy src/fx1
          # fx1 is 100% strict-clean (65/65 modules as of 2026-09-28) —
          # --strict keeps new code strict at birth; no allowlist needed.
          uv run mypy --strict src/fx1
      - name: Tests
        run: make fx1-test
      # Documented contract (docs/FX1_TRAINING.md): honesty inheritance is
      # blocking — fails if fx-1's forbidden set drifts from the lab catalog.
      - name: Honesty inheritance gate
        run: PYTHONPATH=src uv run pytest tests/fx1 -q -k honesty
      - name: Corpus contract smoke
        run: |
          uv run fx1 corpus build --receipts-dir receipts --out "$RUNNER_TEMP/fx1_corpus.jsonl"
          uv run python - <<'PY'
          import json
          import os
          import re

          path = os.path.join(os.environ["RUNNER_TEMP"], "fx1_corpus.jsonl")
          with open(path, encoding="utf-8") as fh:
              rows = [json.loads(line) for line in fh if line.strip()]
          assert rows, "corpus smoke produced no lines"
          for row in rows:
              assert {"messages", "negative", "receipt_sha256", "source_path"} <= row.keys(), row.keys()
              assert re.fullmatch(r"[0-9a-f]{64}", row["receipt_sha256"]), row["receipt_sha256"]
          print(f"corpus contract OK: {len(rows)} provenance-hashed lines")
          PY
