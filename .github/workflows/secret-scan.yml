name: Secret scan

# gitleaks over the full git history of the checkout. Findings are redacted
# in the log. The allowlist is .gitleaks.toml (content hashes and one
# synthetic test canary). This job does not print secret values.

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          version="8.30.1"
          expected="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${expected}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks.tar.gz gitleaks
          gitleaks version

      - name: Scan history reachable from this checkout
        # Default gitleaks log options include --all, which scans every
        # branch fetch-depth 0 downloads, including other open pull requests.
        # --full-history keeps the scan on commits reachable from HEAD.
        run: gitleaks detect --source . --redact --no-banner --config .gitleaks.toml --log-opts=--full-history --verbose
