name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# NOTE: deliberately NOT filtered with paths-ignore. This workflow runs
# `mkdocs build --strict`, whose whole job is to catch a broken nav reference,
# bad link, or malformed page — so a Markdown change is exactly the change that
# can break it. An earlier revision added `paths-ignore: ['**/*.md','docs/**']`
# here on the theory that doc churn is harmless; that is inverted and would have
# meant this workflow never ran for the files it exists to validate. Budget is
# reclaimed in matrix.yml (36 jobs), not here.

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# PRs only build. Push to main uploads a Pages artifact and deploys it when
# GitHub Pages is enabled (Settings → Pages → Source = GitHub Actions).
# Deploy probes the Pages API first and soft-skips on HTTP 404 so a repo
# without Pages configured does not fail the workflow; build --strict still
# gates every PR/push. Real deploy failures (Pages enabled but publish
# broken) remain hard failures.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Lockfile consistency
        run: uv lock --check
      - name: Sync documentation environment
        run: uv sync --frozen --only-group docs
      - name: Build strict site
        run: uv run --only-group docs --frozen mkdocs build --strict
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check whether GitHub Pages is enabled
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || true)
          echo "http_code=${code}" >> "$GITHUB_OUTPUT"
          if [ "$code" = "404" ]; then
            echo "::notice title=docs deploy::GitHub Pages is not enabled; skipping publish (mkdocs build --strict already validated the site). Enable Settings → Pages → Source = GitHub Actions to publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=docs deploy::Unexpected Pages API status ${code}; attempting deploy"
            cat /tmp/pages.json || true
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
