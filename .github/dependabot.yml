version: 2
updates:
  # Python dependencies. uv.lock is the lockfile CI installs with
  # `uv sync --frozen`. Dependabot's uv ecosystem opens PRs that update
  # both pyproject.toml and uv.lock.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns:
          - pytest*
          - hypothesis
          - ruff
          - mypy
          - pre-commit
  # Vendored Kronos has independent pip requirements; the root is managed
  # exclusively by uv so duplicate root Python update PRs cannot drift.
  - package-ecosystem: pip
    directories:
      - /third_party/kronos
      - /third_party/kronos/webui
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      kronos:
        patterns:
          - "*"
  - package-ecosystem: npm
    directories:
      - /web
      - /replay
      - /clients/typescript
      - /clients/typescript/fx1
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      tooling:
        dependency-type: development
  - package-ecosystem: cargo
    directory: /rust/quant_core
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-bindings:
        patterns:
          - pyo3*
          - numpy
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
