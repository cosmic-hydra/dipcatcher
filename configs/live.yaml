# Armed order gateway. Default venue is the in-process loopback, which cannot
# reach a broker. alpaca-paper is the only networked venue. alpaca-live names
# api.alpaca.markets and is refused by the honesty contract; do not delete
# the venue to hide that refusal. Credentials come from the environment
# (ALPACA_API_KEY_ID / ALPACA_API_SECRET_KEY, or the APCA_* names) and are
# never committed. A fill is broker accounting, not a research result.
schema_version: 1
venue: loopback
starting_cash: 100000
calendar: us_rth
pretrade_config: pretrade_risk.yaml
state_dir: data/live/default
cash_tolerance: 0.01
position_tolerance: 0.000000001
